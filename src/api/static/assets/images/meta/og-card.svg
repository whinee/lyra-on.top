<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191a28"/>
      <stop offset="50%" stop-color="#232540"/>
      <stop offset="100%" stop-color="#191a28"/>
    </linearGradient>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#ff6dd6"/>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Outer Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#2f3257" stroke-width="4"/>

  <!-- Main Card -->
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="#232540" stroke="#fd7da6" stroke-width="6" filter="url(#card-shadow)"/>

  <!-- Top Decorative Badge -->
  <g transform="translate(100, 100)">
    <rect width="280" height="42" rx="21" fill="#2f3257" stroke="#ae89ff" stroke-width="3"/>
    <text x="140" y="27" fill="#fff3a8" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle" letter-spacing="1">
      PORTFOLIO &amp; TALK SLIDES ✧
    </text>
  </g>

  <!-- Main Heading: Lyra Phasma -->
  <text x="100" y="210" fill="#fd7da6" font-family="sans-serif" font-weight="900" font-size="72">
    Lyra Phasma <tspan fill="#ff6dd6">:3</tspan>
  </text>

  <!-- Tagline -->
  <text x="100" y="270" fill="#75beff" font-family="sans-serif" font-weight="700" font-size="28">
    Software developer • Cyberdeck builder • FOSS advocate! ✧
  </text>

  <!-- Talk / Speaker Note -->
  <g transform="translate(100, 315)">
    <rect width="680" height="80" rx="14" fill="#191a28" stroke="#3b3fa8" stroke-width="3"/>
    <text x="24" y="34" fill="#fff3a8" font-family="monospace" font-weight="bold" font-size="16">
      SPEAKING AT: Hack &amp; Yap Episode II (17 Oct 2026)
    </text>
    <text x="24" y="60" fill="#ae89ff" font-family="sans-serif" font-size="15">
      "Weird, Improvised Exciting Device (named WhiskerFrame)..."
    </text>
  </g>

  <!-- URL Tag -->
  <g transform="translate(100, 440)">
    <rect width="240" height="56" rx="28" fill="#fd7da6"/>
    <text x="120" y="36" fill="#191a28" font-family="sans-serif" font-weight="900" font-size="22" text-anchor="middle">
      lyra-on.top ✧
    </text>
  </g>

  <!-- Right Mascot Showcase Box -->
  <g transform="translate(840, 140)">
    <!-- WhiskerFrame Cyberdeck Mascot Silhouette / Graphic -->
    <rect x="0" y="0" width="240" height="320" rx="20" fill="#191a28" stroke="#75beff" stroke-width="4"/>
    <!-- Cat Ears -->
    <polygon points="40,30 20,-10 70,10" fill="#2f3257" stroke="#fd7da6" stroke-width="4"/>
    <polygon points="200,30 220,-10 170,10" fill="#2f3257" stroke="#fd7da6" stroke-width="4"/>
    <!-- Screen -->
    <rect x="25" y="45" width="190" height="150" rx="12" fill="#232540" stroke="#3b3fa8" stroke-width="3"/>
    <!-- Blinking Eyes -->
    <rect x="65" y="100" width="24" height="8" rx="3" fill="#29dbff"/>
    <rect x="151" y="100" width="24" height="8" rx="3" fill="#29dbff"/>
    <text x="120" y="150" fill="#ae89ff" font-family="monospace" font-size="16" text-anchor="middle">uwu&gt; :3</text>
    <!-- Keyboard Deck -->
    <rect x="25" y="210" width="190" height="70" rx="8" fill="#2f3257" stroke="#fd7da6" stroke-width="3"/>
    <!-- Mascot Label -->
    <text x="120" y="306" fill="#fff3a8" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">
      SIDEKICK: WhiskerFrame
    </text>
  </g>

  <!-- Decorative Sparkles -->
  <text x="1110" y="120" fill="#fff3a8" font-size="32">✧</text>
  <text x="760" y="180" fill="#ff6dd6" font-size="24">✦</text>
  <text x="80" y="530" fill="#75beff" font-size="28">★</text>
</svg>
