<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ content.meta.title }}</title>
    <meta name="description" content="{{ content.meta.description }}">
    <link rel="canonical" href="{{ content.meta.canonical_url }}">

    <!-- Open Graph / Social Meta -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ content.meta.title }}">
    <meta property="og:description" content="{{ content.meta.description }}">
    <meta property="og:url" content="{{ content.meta.canonical_url }}">
    <meta property="og:image" content="{{ content.meta.og_image }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ content.meta.title }}">
    <meta name="twitter:description" content="{{ content.meta.description }}">
    <meta name="twitter:image" content="{{ content.meta.og_image }}">

    <!-- Favicon & Touch Icon -->
    <link rel="icon" type="image/x-icon" href="/static/assets/images/favicon.ico">

    <!-- CSS Tokens & Foundation -->
    <link rel="stylesheet" href="/static/stylesheets/tokens.css">
    <link rel="stylesheet" href="/static/stylesheets/base.css">
    <link rel="stylesheet" href="/static/stylesheets/cursor.css">
    <link rel="stylesheet" href="/static/stylesheets/nav.css">

    <!-- Section-specific Stylesheets -->
    {% block styles %}{% endblock %}
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content :3</a>
    {% include "partials/nav.html" %}

    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Optional Client FX & Interactions (Vanilla JS, JS-optional) -->
    <script src="/static/scripts/whisker.js" defer></script>
    <script src="/static/scripts/fx.js" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
