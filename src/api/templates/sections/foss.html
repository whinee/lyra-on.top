<!-- FOSS Banner section - Section 4 (W1-FOSS) -->
<section id="foss" class="foss-section" aria-label="Free and Open Source Software Advocacy">
    <div class="container">
        <div class="foss-banner-card">
            <!-- Loud Decorative Header Ribbon -->
            <div class="foss-ribbon">
                <span class="ribbon-star" aria-hidden="true">★</span>
                <span class="ribbon-label">OPEN SOURCE MANIFESTO</span>
                <span class="ribbon-star" aria-hidden="true">★</span>
            </div>

            <!-- Loudest Slogan on the Page -->
            <blockquote class="foss-slogan">
                <p class="slogan-line">"{{ content.foss.slogan }}"</p>
            </blockquote>

            <!-- Subtitle with high contrast -->
            <p class="foss-subtitle">
                {{ content.foss.subtitle }}
                <span class="foss-kaomoji" aria-hidden="true">{{ content.foss.kaomoji }}</span>
            </p>

            <!-- Decorative Badges Grid -->
            <div class="foss-badges" aria-hidden="true">
                <span class="foss-pill"><span>NO PROPRIETARY LOCK-IN</span></span>
                <span class="foss-pill"><span>COPYLEFT &amp; FREEDOM</span></span>
                <span class="foss-pill"><span>HACK THE FUTURE ✧</span></span>
            </div>
        </div>
    </div>
</section>
