<!-- Slides section - Section 2 -->
<section id="slides" class="slides-section container" aria-labelledby="slides-title">
    <div class="card">
        <h2 id="slides-title">✧ {{ content.slides.event_name }}</h2>
        <p class="event-details text-secondary">{{ content.slides.event_date }} • {{ content.slides.event_venue }}</p>
        <p class="talk-title"><strong>Talk:</strong> {{ content.slides.talk_title }}</p>

        <div class="slides-cta-block">
            {% if content.slides.slides_url != "TODO(lyra)" %}
                <a href="{{ content.slides.slides_url }}" class="btn btn-primary" target="_blank" rel="noopener">Open Slides</a>
            {% else %}
                <div class="sticker">{{ content.slides.slides_note }}</div>
            {% endif %}
        </div>
    </div>
</section>
